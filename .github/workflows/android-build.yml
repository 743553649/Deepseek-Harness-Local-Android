name: android-build

# dsh-android 构建流水线
# v0.1.0-m0.2 · 2026-08-27
#
# 单架构（arm64-v8a 真机）——x86_64 只对 PC 上的安卓模拟器有意义，
# 真机装不上（INSTALL_FAILED_NO_MATCHING_ABIS），已移除以免误下与浪费缓存：
#   collect-runtime —— 从 Termux 仓库收集 aarch64 node 运行时 → runtime.zip
#   build-apk       —— 注入 runtime.zip 进 assets → gradle -Pabi=... 出 APK
#   release         —— tag 触发时发布 APK
#
# 注意：collect-runtime 脚本包名已对照 Termux Packages 索引核实过。

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Release 上传需要

jobs:
  collect-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ---- 运行时缓存：整条流水线的真正瓶颈 ----
      # collect 要下载 Termux 运行时依赖闭包（约 18 分钟），而编译 APK 只要 3 分钟。
      # 产物只随 collect-termux-runtime.sh 与 patch-*.py 变化，故用脚本内容哈希做 key：
      # 脚本一改自动失效重建，绝不会用到过期/错误的运行时。
      # 命中时跳过下载 → 一次构建从 ~21 分钟降到 ~4 分钟。
      # continue-on-error：缓存服务抖动不该拖垮构建，失败时回退为正常下载。
      - name: 恢复运行时缓存（命中即跳过下载）
        id: runtime-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: runtime.zip
          key: termux-runtime-${{ matrix.termux_arch }}-v1-${{ hashFiles('scripts/collect-termux-runtime.sh', 'scripts/patch-*.py') }}

      - name: 收集 Termux Node 运行时（${{ matrix.termux_arch }}）
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt dpkg-dev zip
          chmod +x scripts/collect-termux-runtime.sh
          ./scripts/collect-termux-runtime.sh runtime.zip ${{ matrix.termux_arch }}

      - name: 缓存命中确认
        if: steps.runtime-cache.outputs.cache-hit == 'true'
        run: |
          ls -lh runtime.zip
          echo "✅ 运行时缓存命中，已跳过 Termux 下载"

      - name: 校验运行时命令闭包（${{ matrix.abi }}）
        run: |
          rm -rf runtime-check && mkdir runtime-check
          unzip -q runtime.zip -d runtime-check
          test -x runtime-check/bin/bash
          test -x runtime-check/bin/rg
          # SONAME 精确文件名（Android linker 按 NEEDED 逐字查找）
          for so in libreadline.so.8 libhistory.so.8 libncursesw.so.6 libncurses.so.6 \
                    libiconv.so libpcre2-8.so; do
            test -e "runtime-check/lib/$so" || { echo "::error::SONAME 库 lib/$so 缺失"; exit 1; }
          done
          # 工具 wrapper（m1.6.8 真机验证版）
          test -x runtime-check/bin/pnpm
          test -x runtime-check/bin/curl
          test -e runtime-check/usr/bin/.keep
          # ripgrep 平台包（android resolver 的 require.resolve 目标）
          case "${{ matrix.termux_arch }}" in
            aarch64) NA=arm64 ;; x86_64) NA=x64 ;;
          esac
          test -x "runtime-check/lib/node_modules/@vscode/ripgrep-android-$NA/bin/rg" \
            || { echo "::error::ripgrep 平台包缺失"; exit 1; }
          if find runtime-check -type f -path '*@vscode/ripgrep-linux-*/*/rg' -print -quit | grep -q .; then
            echo "::error::runtime 混入宿主 Linux ripgrep"
            exit 1
          fi
          echo "bash/rg/SONAME/wrapper runtime closure OK"

      - name: 计算校验值
        id: meta
        run: |
          echo "sha256=$(sha256sum runtime.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s runtime.zip)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: runtime.zip
          retention-days: 1

  build-apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - termux_arch: aarch64
            abi: arm64-v8a
    runs-on: ubuntu-24.04
    needs: [collect-runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-${{ matrix.abi }}
          path: .

      - name: 注入 runtime.zip 到 assets
        run: mv runtime.zip app/src/main/assets/runtime.zip

      - name: 回填 MANIFEST 版本与校验值
        run: |
          SHA=$(sha256sum app/src/main/assets/runtime.zip | cut -d' ' -f1)
          VER="${GITHUB_REF_NAME:-dev}-$(date +%Y%m%d)"
          jq --arg sha "$SHA" --arg ver "$VER" \
            '.version=$ver | .sha256=$sha' \
            app/src/main/assets/runtime/MANIFEST.json > /tmp/m.json
          mv /tmp/m.json app/src/main/assets/runtime/MANIFEST.json

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库不含 gradle-wrapper.jar（二进制不入库），用 setup-gradle 直接提供 gradle 命令
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---- 固定 debug 签名密钥 ----
      # CI 每次都是全新 runner，AGP 会重新生成隐式 debug 密钥库 → 每次构建签名都不同
      # → 无法覆盖安装，只能先卸载旧版（Dev 版数据全丢）。
      # 做法：在仓库根放一把固定密钥库 .ci/debug.keystore（位置显式，由 app/build.gradle.kts
      # 的 signingConfigs 指定 —— 不依赖 AGP 隐式路径，实测那个位置在 CI 上不可控），
      # 用缓存跨构建复用。首次未命中时现场生成，之后每次都是同一把，签名永久稳定。
      - name: 恢复固定的 debug 签名密钥
        id: keystore-cache
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: .ci/debug.keystore
          key: android-debug-keystore-v2
          restore-keys: |
            android-debug-keystore-

      - name: 生成固定 debug 密钥库（缓存未命中时）
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .ci
          keytool -genkeypair -v -keystore .ci/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 把密钥库指纹打进日志：跨构建若指纹一致，即证明签名已固定
      - name: 打印签名密钥指纹（跨构建应完全一致）
        run: sha256sum .ci/debug.keystore

      - name: 构建 APK（${{ matrix.abi }}）
        run: gradle -p . assembleDebug -Pabi=${{ matrix.abi }} --stacktrace

      # 防呆自检：真机 16KB 页内核上 p_align=4096 的 so 会 dlopen 失败
      # （v0.1.0-m1 真机「卡在启动中」事故根因）。所有 LOAD 段必须 >=16384。
      - name: 校验 so 16KB 页对齐（${{ matrix.abi }}）
        run: |
          mkdir -p chk && cd chk
          unzip -o ../app/build/outputs/apk/debug/app-debug.apk 'lib/*.so' >/dev/null
          FAIL=0
          # 注意：readelf -lW 的 Align 列是 16 进制（如 0x4000），必须显式转十进制
          for so in $(find lib -name '*.so'); do
            BAD=$(readelf -lW "$so" \
              | awk '/LOAD/{v=$NF; if (v ~ /^0[xX]/){("printf %d " v) | getline n; close("printf %d " v)} else n=v+0; if (n+0 < 16384) print FILENAME": align="v}' \
              | head -3)
            if [ -n "$BAD" ]; then
              echo "::error file=$so::LOAD 段对齐 <16384：$BAD"
              FAIL=1
            else
              echo "OK $so"
            fi
          done
          exit $FAIL

      # Gradle 对所有 ABI 都输出同名 app-debug.apk；
      # 必须在产物级先重命名，否则 release merge 时后传者覆盖先传者
      - name: 按版本+架构重命名 APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dsh-android-${GITHUB_REF_NAME}-${{ matrix.abi }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-android-debug-apk-${{ matrix.abi }}
          path: dist/*.apk
          retention-days: 1   # 仅 job 间传递用，避免 90 天默认堆积百 MB×N（曾堆 32GB）

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [build-apk]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-android-debug-apk-*
          merge-multiple: true
          path: apk/

      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
          generate_release_notes: true
